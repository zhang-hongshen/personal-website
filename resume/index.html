<!DOCTYPE html>
<html lang="en" data-root="../" data-page="resume" data-title-en="Resume · Zhang Hongshen" data-title-zh="简历 · 张鸿燊">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume · Zhang Hongshen</title>
    <link rel="stylesheet" href="../common/site.css">
    <script src="../common/site.js"></script>
    <style>
        .resume-wrap { padding: 40px 0 64px; }
        iframe {
            width: 100%;
            height: 1000px;
            border: none;
            overflow: hidden;
            display: block;
            background: transparent;
        }
        @media (max-width: 768px) {
            .resume-wrap { padding: 0; }
            .resume-wrap .wrap { padding: 0; }
        }
    </style>
</head>

<body>
    <main class="resume-wrap">
        <div class="wrap">
            <iframe id="resume-frame" scrolling="no" title="Resume"></iframe>
        </div>
    </main>

    <script>
        const resumeFiles = {
            "en": "resume_en.html",
            "zh-CN": "resume_zh-CN.html",
        };
        const frame = document.getElementById("resume-frame");

        // Pass the site's theme into the framed resume so both match.
        function syncTheme() {
            try {
                const doc = frame.contentDocument;
                if (!doc) return;
                doc.documentElement.classList.add("embedded");
                const theme = document.documentElement.dataset.theme;
                if (theme) doc.documentElement.dataset.theme = theme;
                else doc.documentElement.removeAttribute("data-theme");
            } catch (e) {
                console.error(e);
            }
        }

        function adjustIframeHeight() {
            try {
                const doc = frame.contentDocument || frame.contentWindow.document;
                if (doc && doc.documentElement) {
                    // 额外增加一些像素防止因为高度计算微小误差导致出现滚动条
                    frame.style.height = (doc.documentElement.scrollHeight + 30) + "px";
                }
            } catch (e) {
                console.error(e);
            }
        }

        function showResume(lang) {
            const src = resumeFiles[lang] || resumeFiles.en;
            if (frame.getAttribute("src") !== src) frame.src = src;
        }

        frame.addEventListener("load", () => { syncTheme(); adjustIframeHeight(); });
        document.addEventListener("themechange", syncTheme);
        window.addEventListener("resize", adjustIframeHeight);
        document.addEventListener("langchange", (e) => showResume(e.detail));
        showResume(getSelectedLanguage());
    </script>
</body>

</html>
